<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TodoList_C — Protótipo</title>
<!--
  TodoList_C — protótipo clicável da Etapa 1 (PRD §9).
  Arquivo único, sem dependências externas: abra direto no navegador.
  Dados em memória, espelhados no localStorage só para não perder o teste ao recarregar.
-->
<style>
:root{
  --bg:#eceff1; --surface:#fff; --ink:#1d2329; --muted:#66707a; --line:#d6dbdf; --hover:#f6f2e4;
  --accent:#2f7d4f; --danger:#b3261e;
  /* cores de marca tiradas do logo saladaMista: fundo do logo e verde da palavra "mista" */
  --date-band:#323A3D; --section-default:#4AA05C; --warn:#C55A11;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;white-space:nowrap}
.btn:hover{background:#f3f5f6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:0;background:transparent;padding:4px;border-radius:4px;color:#5b646d;display:inline-flex}
.iconbtn:hover{background:#e6e9eb;color:#111}
.iconbtn.danger:hover{color:var(--danger)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:#e3e7ea;font-size:11.5px;line-height:18px;text-align:center}
.badge.warn{background:var(--warn);color:#fff}
.field{display:block;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(47,125,79,.15)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
.top .logo-btn{padding:2px 4px;margin-left:-4px}
.top .brand{font-weight:700;font-size:15px;margin-right:6px;padding-left:10px;border-left:1px solid var(--line)}
.top .today{color:var(--muted);margin-right:auto}
.top .user{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;font-size:12.5px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#2f9e5a}
.sync.busy .dot{background:#d9a400;animation:pulse 1s infinite}
.sync.off{border-color:#e9b9a0;background:#fdf3ee;color:#8a3a10}
.sync.off .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}

/* ---------- folha (tela e impressão compartilham o visual) ---------- */
.date-band{background:var(--date-band);color:#fff;font-weight:700;text-align:center;padding:.4em;font-size:1.3em;letter-spacing:.02em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.date-band small{font-weight:400;font-size:.68em;opacity:.9;margin-left:.5em}
.date-band.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:.25em .3em}
.date-band .nav-btn{border:0;background:transparent;color:#fff;font-size:1.1em;font-weight:700;line-height:1;padding:.25em .6em;border-radius:5px}
.date-band .nav-btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.date-band .nav-btn:disabled{opacity:.25;cursor:default}
.sec-box{border:3px solid #000;margin-top:.9em}
.sec-head{background:var(--section-default);color:#fff;font-weight:700;padding:.28em .6em;border-bottom:3px solid #000;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.desk{padding:20px 16px 90px}
.sheet{max-width:860px;margin:0 auto;background:#fff;padding:22px 26px 30px;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 28px rgba(0,0,0,.06);font-size:15px}
.sec-body{padding:6px 8px 12px}
.row{display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:4px;min-height:31px}
.row[tabindex]:hover,.row:focus,.row:focus-within{background:var(--hover)}
.row:focus{outline:none;box-shadow:inset 0 0 0 1.5px #d9b84a}
.row.lv2{padding-left:32px}
.row .chk{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none}
.bullet{width:12px;text-align:center;font-size:11px;flex:none;color:#222}
.row .txt{flex:1;min-width:0;overflow-wrap:anywhere;cursor:default}
.row.done .txt{text-decoration:line-through;color:#8b9298}
.row .acts{display:flex;gap:1px;opacity:0;transition:opacity .1s}
.row:hover .acts,.row:focus .acts,.row:focus-within .acts{opacity:1}
.row .edit{flex:1;padding:3px 6px;border:1px solid var(--accent);border-radius:4px}
.tag-plan{font-size:11px;background:#e5f2ea;color:#246b40;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag-late{font-size:11px;background:#fdeee6;color:#8a3a10;border-radius:4px;padding:1px 6px;white-space:nowrap}
.add-row{display:flex;align-items:center;gap:7px;padding:4px 4px 0 27px}
.add-row.lv2{padding-left:55px}
.add-row .bullet{color:#b5bbc0}
.add-row input{flex:1;border:0;border-bottom:1px dashed #c5cbd0;padding:4px 2px;background:transparent}
.add-row input:focus{outline:none;border-bottom-color:var(--accent)}
.add-mode{font-size:11.5px;color:var(--accent);padding:2px 0 0 55px;display:flex;align-items:center;gap:6px}
.empty-sec{color:#9aa1a7;font-style:italic;padding:4px 4px 0 27px;font-size:13px}

.banner{max-width:860px;margin:0 auto 14px;background:#fff7e0;border:1px solid #f0d58a;border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.readonly-tag{display:inline-block;margin-left:8px;font-size:11px;background:#fff;color:#8a3a10;border-radius:4px;padding:1px 6px;font-weight:600;vertical-align:middle}

.foot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 0;color:var(--muted);font-size:12px}
.logo-btn{border:0;background:transparent;padding:4px 8px;border-radius:6px;display:inline-flex}
.logo-btn:hover{background:#dfe4e7}
.logo-img{display:block;width:auto;border-radius:4px}
.login-card .logo-img,.sobre .logo-img{margin:0 auto}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:min(380px,100%);background:#fff;border-radius:12px;padding:28px 28px 22px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
.login-card h1{margin:10px 0 2px;font-size:22px}
.login-card form{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:12px}
.login-card .btn{justify-content:center;padding:9px 12px}
.google-g{font-weight:800;color:#4285f4;font-size:16px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0 2px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;font-size:13px}
.login-links{display:flex;justify-content:space-between;margin-top:12px}
.note{font-size:12px;color:var(--muted);margin-top:16px;background:#f4f6f7;border-radius:6px;padding:7px 9px}
.msg-ok{background:#e5f2ea;color:#1f5e38;border-radius:6px;padding:8px 10px;font-size:13px;text-align:left}

/* ---------- assistente ---------- */
.wz{max-width:860px;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.wz-body{padding:16px 22px 8px}
.wz-block{margin-bottom:18px}
.wz-block h3{font-size:14.5px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.wz-sec{margin:0 0 10px}
.wz-sec-h{display:inline-block;background:var(--section-default);color:#fff;font-weight:700;font-size:12.5px;padding:1px 8px;border:2px solid #000;margin-bottom:4px}
.wz-row{display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:4px;min-height:29px}
.wz-row:hover{background:var(--hover)}
.wz-row.lv2{padding-left:30px}
.wz-row label{display:flex;align-items:center;gap:7px;flex:1;cursor:pointer}
.wz-row input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.wz-row.off label .txt{color:#9aa1a7}
.vazio{color:#9aa1a7;font-style:italic;margin:4px 0}
.wz-foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 22px;background:#fafbfb;border-top:1px solid var(--line)}
.wz-add{display:flex;gap:8px;align-items:center;margin:4px 0 2px 4px}
.wz-add input{flex:1}

/* ---------- modais ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,25,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50;overflow:auto}
.overlay.dlg{z-index:60;background:rgba(20,25,30,.3)}
.modal{background:#fff;border-radius:10px;width:min(640px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(1000px,100%)}
.modal.small{width:min(420px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px;margin:0}
.modal-b{padding:14px 18px;max-height:70vh;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;align-items:center}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eef0f2}
.mrow .txt{flex:1;min-width:160px}
.sec-tag{font-size:11px;font-weight:700;background:var(--section-default);border:1px solid #000;padding:0 6px;white-space:nowrap}
.group-h{font-weight:600;margin:14px 0 2px;color:#38414a}
.group-h:first-child{margin-top:0}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#f5f7f8;border-radius:8px;margin-bottom:12px}
.inline-form .field{width:auto;flex:1;min-width:140px;padding:6px 9px}
.inline-form select.field,.inline-form input[type=date].field{flex:none}
.kbd{display:inline-block;border:1px solid #c9cfd4;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;font-family:Consolas,monospace;background:#fafafa}
table.atalhos{border-collapse:collapse;width:100%}
table.atalhos td{padding:6px 4px;border-bottom:1px solid #eef0f2}
.sobre{text-align:center}
.sobre dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;text-align:left;margin:16px auto 0;max-width:380px}
.sobre dt{color:var(--muted)}
.sobre dd{margin:0}

/* ---------- pré-visualização A4 ---------- */
.print-opts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.a4-stage{background:#8d969d;border-radius:6px;padding:12px;overflow:hidden}
.a4-stage{display:flex;justify-content:center}
.a4-scale{flex:none}
.a4{transform-origin:top left}
.a4{width:210mm;min-height:297mm;padding:10mm;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.psheet{font-family:Calibri,"Segoe UI",Arial,sans-serif;color:#000;font-size:12pt}
.psheet .date-band{font-size:1.35em;padding:.3em}
.plist{list-style:none;margin:0;padding:.3em .6em 0}
.plist li{display:flex;gap:.45em;line-height:1.32;padding:.05em 0}
.plist li.lv2{padding-left:1.7em}
.plist .b{flex:none;width:.9em;font-size:.8em;line-height:1.65}
.plist li.done .t{text-decoration:line-through;color:#555}
.psheet .notes{height:3.4em}
/* rodapé do paper: logo com fundo branco, preso ao pé da página quando cabe em 1 folha */
.psheet{display:flex;flex-direction:column;min-height:270mm}
.p-foot{margin-top:auto;padding-top:5mm;display:flex;justify-content:center}
.p-foot img{height:8mm;width:auto}
.sheet-foot{display:flex;justify-content:center;margin-top:22px}

/* ---------- toasts e simulação ---------- */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:#263038;color:#fff;border-radius:8px;padding:9px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast button{border:0;background:none;color:#ffd166;font-weight:600;padding:0}
#sim{position:fixed;left:12px;bottom:12px;z-index:40}
.sim{background:#263038;color:#e8edf0;border-radius:10px;padding:10px 12px;width:250px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sim h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#ffd166;display:flex;justify-content:space-between;align-items:center}
.sim .r{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sim button{background:#3a4650;border:0;border-radius:5px;padding:4px 8px;color:#fff;font-size:12px}
.sim button:hover{background:#4a5864}
.sim-min{background:#263038;color:#ffd166;border:0;border-radius:16px;padding:6px 12px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

#print-root{display:none}
@page{size:A4 portrait;margin:10mm}
@media print{
  html,body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  .psheet .sec-box{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:640px){
  .sheet{padding:14px 12px 20px}
  .row .acts{opacity:1}
  .top .today{width:100%;order:2}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sim"></div>
<div id="toasts"></div>
<div id="print-root"></div>

<script>
'use strict';
/* =====================================================================
   Constantes e utilidades
   ===================================================================== */
const APP = { nome:'TodoList_C', versao:'1.0.0', build:'2026.11.04-proto', dataBuild:'2026-11-04' };
const KEY = 'todolist_c.prototipo.v1';
const COR_SECAO = '#4AA05C'; // verde da palavra "mista" no logo
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => new Date().toISOString();
function uid(){ try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return 'id-'+Math.random().toString(36).slice(2)+Date.now().toString(36); }
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function isoD(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function addDias(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return isoD(d); }
function fmt(s){ const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
function fmtCurto(s){ const [,m,d]=s.split('-'); return `${d}/${m}`; }
const diaSemana = s => DIAS[parseD(s).getDay()];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const difDias = (a,b) => Math.round((parseD(b)-parseD(a))/864e5);
const byOrdem = (a,b) => a.ordem-b.ordem;
const trunc = (s,n=40) => s.length>n ? s.slice(0,n-1)+'…' : s;
function corTexto(hex){ const n=parseInt(hex.slice(1),16); const l=(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255; return l<0.55?'#fff':'#000'; }

const IC = {
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  sub:'<polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  up:'<polyline points="18 15 12 9 6 15"/>',
  down:'<polyline points="6 9 12 15 18 9"/>',
  move:'<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
  del:'<path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  print:'<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  back:'<polyline points="15 18 9 12 15 6"/>',
  check:'<polyline points="20 6 9 17 4 12"/>'
};

let S = null;
const T = { // estado transitório da interface
  wz:null, modal:null, dialog:null, editId:null, viewDate:null, dataAtual:null, focusRow:null, focusKey:null, focusVal:null,
  addMode:{}, syncing:false, syncTimer:null, simOpen:true, loginMode:'login', loginMsg:'',

function snapItem(a, planejado){
  return { atividadeId:a.id, secaoId:a.secaoId, parentId:a.parentId, texto:a.texto, status:a.status, ordem:a.ordem, planejado:!!planejado };
}

function novoEstado(modo){
  const st = { versao:1, usuario:null, hoje:'2026-11-04', online:true, pendentesSync:0, ultimaSync:now(),
               seq:0, secoes:[], atividades:[], papers:[], avisoNovoDia:false };
  const sec = (nome, ordem) => { const s={ id:uid(), nome, cor:COR_SECAO, ordem, arquivada:false, updatedAt:now() }; st.secoes.push(s); return s; };
  const at = (secao, texto, o={}) => {
    const a = { id:uid(), secaoId:secao.id, parentId:o.pai?o.pai.id:null, texto, ordem:++st.seq,
                status:o.status||'pendente', dataPlanejada:o.data||null, planejadaPendente:!!o.data,
                foraDoPaper:false, porPai:false, criadaEm:now(), concluidaEm:o.status==='concluida'?now():null,
                updatedAt:now(), deletedAt:null };
    st.atividades.push(a); return a;
  };
  if(modo==='vazio'){ sec('Profissional',1); sec('Pessoal',2); return st; } // RF-40

  // Dados do Exemplo 1 (paper de 03/11/2026). Concluídos = os que sumiram no Exemplo 2.
  const dxc = sec('Atividades DXC',1), pes = sec('Atividades Pessoais',2);
  const C = { status:'concluida' }, noPaper = [];
  const p = (...args) => { const a = at(...args); noPaper.push(a); return a; };
  p(dxc,'Thadeu.viagem bh'); p(dxc,'Ibm.oportunidades'); p(dxc,'Ronaldo.contrato'); p(dxc,'Duva.software testes');
  p(dxc,'Zouain.opx network',C); p(dxc,'Emerson.app os',C);
  const ag = p(dxc,'Agenda');
  ['Amanda','Fabricio','Tati','Kaio','Darbely','Leo','Jonas','Andre'].forEach(n => p(dxc,n,{pai:ag}));
  p(pes,'Habilitacao detran'); p(pes,'Contato Safra => Conta Internacional');
  p(pes,'Caixa econômica => Baixa e fechamento da conta'); p(pes,'Banco do Brasil => Transferência e fechamento da conta');
  p(pes,'BRB Mengo => Fechamento da conta',C); p(pes,'XP => Fechamento da conta',C); p(pes,'Inter => Fechamento da conta',C);
  p(pes,'IBMR'); p(pes,'Pagamento Light',C);
  st.papers.push({ id:uid(), data:'2026-11-03', criadoEm:now(), impressoEm:null, itens:noPaper.map(a=>snapItem(a,false)) });
  // Planejadas
  at(dxc,'Revisão SFDC',{data:'2026-11-04'});
  at(dxc,'Governança SFDC',{data:'2026-11-04'});
  at(pes,'Revisar fatura do cartão',{data:'2026-11-06'});
  at(dxc,'Preparar pauta do comitê SFDC',{data:'2026-11-10'});
  return st;
}

function salvar(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function carregar(){
  try{
    const t = localStorage.getItem(KEY);
    if(t){
      const s = JSON.parse(t);
      if(s && s.versao===1){ s.secoes.forEach(x=>{ if(x.cor==='#FFC000') x.cor = COR_SECAO; }); return s; } // cor padrão antiga → nova
    }
  }catch(e){}
  return null;
}

/* ---------- consultas ---------- */
const ativ = id => S.atividades.find(a=>a.id===id);
const secao = id => S.secoes.find(s=>s.id===id);
const secoesAtivas = () => S.secoes.filter(s=>!s.arquivada).sort(byOrdem);
const paperDe = d => S.papers.find(p=>p.data===d);
const paperHoje = () => paperDe(S.hoje);
const ultimoPaperAntes = d => S.papers.filter(p=>p.data<d).sort((a,b)=>a.data<b.data?1:-1)[0] || null;
const filhos = id => S.atividades.filter(a=>a.parentId===id && a.status!=='excluida');
function idsHoje(){ const p=paperHoje(); return new Set(p ? p.itens.map(i=>i.atividadeId) : []); }
function itemHoje(id){ const p=paperHoje(); return p ? p.itens.find(i=>i.atividadeId===id) : null; }
function visiveis(secaoId, parentId){
  const ids = idsHoje();
  return S.atividades.filter(a => ids.has(a.id) && a.status!=='excluida' && a.secaoId===secaoId && (a.parentId||null)===(parentId||null)).sort(byOrdem);
}
const foraDoPaper = () => S.atividades.filter(a=>a.status==='pendente' && a.foraDoPaper);
const planejadas = () => S.atividades.filter(a=>a.status==='pendente' && a.planejadaPendente)
                         .sort((a,b)=> a.dataPlanejada===b.dataPlanejada ? a.ordem-b.ordem : (a.dataPlanejada<b.dataPlanejada?-1:1));
const touch = a => { a.updatedAt = now(); };

/* ---------- persistência + sincronização simulada ---------- */
// Retrato do dia (PaperItem.texto_no_dia / status_no_dia): só o paper de HOJE é atualizado; os anteriores ficam congelados.
function snapshot(){
  const p = paperHoje(); if(!p) return;
  p.itens = p.itens.filter(i=>ativ(i.atividadeId)).map(i=>snapItem(ativ(i.atividadeId), i.planejado));
}
function commit(){ snapshot(); S.pendentesSync++; salvar(); agendarSync(); render(); }
function agendarSync(){
  if(!S.online) return;
  clearTimeout(T.syncTimer); T.syncing = true;
  T.syncTimer = setTimeout(()=>{ T.syncing=false; S.pendentesSync=0; S.ultimaSync=now(); salvar(); renderSync(); }, 900);
}

/* =====================================================================
   Ações sobre atividades
   ===================================================================== */
function novaAtividade(secaoId, parentId, texto, data){
  const a = { id:uid(), secaoId, parentId:parentId||null, texto, ordem:++S.seq, status:'pendente',
              dataPlanejada:data||null, planejadaPendente:!!data, foraDoPaper:false, porPai:false,
              criadaEm:now(), concluidaEm:null, updatedAt:now(), deletedAt:null };
  S.atividades.push(a); return a;
}
function criarNoPaper(secaoId, parentId, texto){
  if(parentId){ const pai=ativ(parentId); if(pai.status==='concluida'){ pai.status='pendente'; pai.concluidaEm=null; touch(pai); } }
  const a = novaAtividade(secaoId, parentId, texto);
  paperHoje().itens.push(snapItem(a,false));
  return a;
}
// RF-22/RF-23/RN-07: concluir o pai conclui os filhos; o contrário não.
function concluir(id){
  const a = ativ(id);
  if(a.status==='pendente'){
    a.status='concluida'; a.concluidaEm=now(); a.porPai=false;
    filhos(id).filter(c=>c.status==='pendente').forEach(c=>{ c.status='concluida'; c.concluidaEm=now(); c.porPai=true; touch(c); });
  } else {
    a.status='pendente'; a.concluidaEm=null; a.porPai=false;
    filhos(id).filter(c=>c.porPai).forEach(c=>{ c.status='pendente'; c.concluidaEm=null; c.porPai=false; touch(c); });
    if(a.parentId){ const pai=ativ(a.parentId); if(pai.status==='concluida'){ pai.status='pendente'; pai.concluidaEm=null; touch(pai); } }
  }
  touch(a); T.focusRow=id; commit();
}
// RF-24: excluir com desfazer; excluir o pai exclui os filhos.
function excluir(id){
  const a = ativ(id), grupo = [a, ...filhos(id)];
  const antes = grupo.map(x=>({ id:x.id, status:x.status }));
  grupo.forEach(x=>{ x.status='excluida'; x.deletedAt=now(); touch(x); });
  commit();
  toast(`“${esc(trunc(a.texto))}” excluída${grupo.length>1?` com ${grupo.length-1} sub-item(ns)`:''}`, ()=>{
    antes.forEach(o=>{ const x=ativ(o.id); x.status=o.status; x.deletedAt=null; touch(x); });
    commit();
  });
}
function editarTexto(id, texto){
  const a = ativ(id); const v = texto.trim();
  if(v && v!==a.texto){ a.texto=v; touch(a); commit(); } else render();
}
function podeRecuar(id){
  const a = ativ(id); if(a.parentId || filhos(id).length) return null;
  const irm = visiveis(a.secaoId,null); const i = irm.findIndex(x=>x.id===id);
  return (i>0 && irm[i-1].status==='pendente') ? irm[i-1] : null;
}
// RF-21: Tab transforma em sub-item do item de cima; Shift+Tab volta para o 1º nível.
function recuar(id){
  const a = ativ(id);
  if(a.parentId) return toast('Limite de 2 níveis: item → sub-item.');
  if(filhos(id).length) return toast('Este item já tem sub-itens e não pode virar sub-item (máx. 2 níveis).');
  const pai = podeRecuar(id);
  if(!pai) return toast('Não há item pendente acima para ser o item pai.');
  a.parentId = pai.id; a.ordem = ++S.seq; touch(a); T.focusRow=id; commit();
}
function desrecuar(id){
  const a = ativ(id); if(!a.parentId) return;
  const pai = ativ(a.parentId); a.parentId = null; a.ordem = pai.ordem + 0.5; renumerar(); touch(a); T.focusRow=id; commit();
}
function renumerar(){ S.atividades.slice().sort(byOrdem).forEach((a,i)=>a.ordem=i+1); S.seq = S.atividades.length; }
// RF-28
function mover(id, dir){
  const a = ativ(id), irm = visiveis(a.secaoId, a.parentId), i = irm.findIndex(x=>x.id===id), b = irm[i+dir];
  if(!b) return;
  [a.ordem, b.ordem] = [b.ordem, a.ordem]; touch(a); touch(b); T.focusRow=id; commit();
}
// RF-29
function moverSecao(id, secaoId){
  const a = ativ(id); [a, ...filhos(id)].forEach(x=>{ x.secaoId=secaoId; touch(x); });
  a.parentId = null; a.ordem = ++S.seq; T.focusRow=id; commit();
  toast(`Movida para “${esc(secao(secaoId).nome)}”`);
}
// RF-26: com data futura, sai do paper de hoje e só volta no paper da data.
function planejar(id, data){
  const a = ativ(id), grupo = [a, ...filhos(id)], p = paperHoje();
  a.dataPlanejada = data; a.planejadaPendente = true;
  grupo.forEach(x=>{ x.foraDoPaper=false; touch(x); });
  if(p) p.itens = p.itens.filter(i=>!grupo.some(x=>x.id===i.atividadeId));
  commit();
  toast(`Planejada para ${diaSemana(data)}, ${fmt(data)}`);
}
// Traz para o paper de hoje (de "Fora do paper" ou "Planejadas"). RF-14: o pai vem junto.
function incluirNoPaper(a){
  const p = paperHoje(); const ids = new Set(p.itens.map(i=>i.atividadeId));
  const add = x => { if(!ids.has(x.id)){ p.itens.push(snapItem(x,false)); ids.add(x.id); } x.foraDoPaper=false; x.planejadaPendente=false; touch(x); };
  if(a.parentId){
    const pai = ativ(a.parentId);
    if(pai && pai.status!=='excluida'){ if(pai.status==='concluida'){ pai.status='pendente'; pai.concluidaEm=null; } add(pai); }
    else a.parentId = null;
  }
  add(a);
  filhos(a.id).filter(c=>c.status==='pendente' && !(c.planejadaPendente && c.dataPlanejada>S.hoje)).forEach(add);
}

/* =====================================================================
   Assistente "Criar paper do dia" (RF-10 a RF-14, RN-03, RN-08, RN-09)
   ===================================================================== */
function montarWizard(){
  const ult = ultimoPaperAntes(S.hoje);
  const pend = [];
  if(ult) ult.itens.forEach(i=>{ const a=ativ(i.atividadeId); if(a && a.status==='pendente' && !a.foraDoPaper && !a.planejadaPendente && !pend.includes(a.id)) pend.push(a.id); });
  const plan = S.atividades.filter(a=>a.status==='pendente' && a.planejadaPendente && a.dataPlanejada<=S.hoje).map(a=>a.id);
  // sub-itens (sem data própria) de uma planejada vêm junto
  plan.slice().forEach(id=>filhos(id).forEach(c=>{
    if(c.status==='pendente' && !c.planejadaPendente && !c.foraDoPaper && !pend.includes(c.id) && !plan.includes(c.id)) plan.push(c.id);
  }));
  // RF-14 / RN-08: sub-item pendente arrasta o pai
  const todos = new Set([...pend, ...plan]);
  [...pend, ...plan].forEach(id=>{
    const a = ativ(id);
    if(a.parentId && !todos.has(a.parentId)){
      const pai = ativ(a.parentId);
      if(pai && pai.status!=='excluida'){ (pend.includes(id)?pend:plan).push(pai.id); todos.add(pai.id); }
    }
  });
  T.wz = { ultimo: ult ? ult.data : null, pend, plan, marcados:new Set(todos), excluidos:new Set(), novos:[] };
}
const wzCandidatos = () => [...T.wz.pend, ...T.wz.plan].filter(id=>!T.wz.excluidos.has(id));
function wzMarcar(id, on){
  const m = T.wz.marcados, cand = new Set(wzCandidatos()), a = ativ(id);
  on ? m.add(id) : m.delete(id);
  if(on && a.parentId && cand.has(a.parentId)) m.add(a.parentId);
  if(!a.parentId) filhos(id).forEach(c=>{ if(cand.has(c.id)) on ? m.add(c.id) : m.delete(c.id); });
}
function criarPaper(){
  const wz = T.wz;
  const p = { id:uid(), data:S.hoje, criadoEm:now(), impressoEm:null, itens:[] };
  S.papers.push(p);
  [...wz.pend, ...wz.plan].forEach(id=>{
    const a = ativ(id);
    if(wz.excluidos.has(id)){ a.status='excluida'; a.deletedAt=now(); touch(a); return; }
    if(wz.marcados.has(id)){ p.itens.push(snapItem(a, wz.plan.includes(id))); a.foraDoPaper=false; a.planejadaPendente=false; }
    else { a.foraDoPaper=true; a.planejadaPendente=false; a.dataPlanejada=null; } // D4 / RN-09
    touch(a);
  });
  wz.novos.forEach(n=>{ const a=novaAtividade(n.secaoId,null,n.texto); p.itens.push(snapItem(a,false)); });
  const fora = [...wz.pend, ...wz.plan].filter(id=>!wz.excluidos.has(id) && !wz.marcados.has(id)).length;
  S.avisoNovoDia = false; T.wz = null; T.addMode = {}; T.viewDate = null;
  commit();
  toast(`Paper de ${fmt(S.hoje)} criado${fora?` · ${fora} item(ns) em “Fora do paper”`:''}`);
}

function render(){
  let html;
  if(!S.usuario) html = telaLogin();
  else if(T.wz) html = telaWizard();
  else if(!paperHoje()){
    if(S.avisoNovoDia && ultimoPaperAntes(S.hoje)) html = telaMain(true);
    else { montarWizard(); html = telaWizard(); }
  }
  else html = telaMain(false);
  document.getElementById('app').innerHTML = html + modalHtml() + dialogHtml();
  document.getElementById('sim').innerHTML = simHtml();
  if(T.modal==='imprimir') ajustarImpressao();
  restaurarFoco();
}
function restaurarFoco(){
  if(T.dialog){ const el=document.querySelector('.overlay.dlg [autofocus]'); if(el) el.focus(); return; }
  if(T.editId){ const el=document.querySelector(`[data-edit="${T.editId}"]`); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
  if(T.focusKey){
    const el=document.querySelector(`[data-focus-key="${T.focusKey}"]`);
    if(el){ el.focus(); if(T.focusVal!=null){ el.value=T.focusVal; } }
    T.focusKey=null; T.focusVal=null; return;
  }
  if(T.focusRow){ const el=document.querySelector(`[data-row="${T.focusRow}"]`); if(el) el.focus(); T.focusRow=null; }
}

function wzLinha(a, origem, prefixoPai, nivel2){

    </label>
    <button type="button" class="iconbtn danger" data-act="wz-excluir" data-id="${a.id}" title="Excluir">${ico('del')}</button>
  </div>`;

function wzLista(ids, origem){
  const set = new Set(ids.filter(id=>!T.wz.excluidos.has(id)));
  if(!set.size) return `<p class="vazio">Nenhum item.</p>`;
  let h = '';
  for(const s of secoesAtivas()){
    const daSec = [...set].map(ativ).filter(a=>a.secaoId===s.id);
    if(!daSec.length) continue;
    const tops = daSec.filter(a=>!a.parentId || !set.has(a.parentId)).sort(byOrdem);
    h += `<div class="wz-sec"><div class="wz-sec-h" style="background:${s.cor};color:${corTexto(s.cor)}">${esc(s.nome)}</div>`;
    for(const a of tops){
      h += wzLinha(a, origem, a.parentId ? ativ(a.parentId).texto : null, false);
      daSec.filter(c=>c.parentId===a.id).sort(byOrdem).forEach(c=>{ h += wzLinha(c, origem, null, true); });
    }
    h += '</div>';
  }
  return h;
}

// Linhas de uma seção num paper: hoje = atividades vivas; dias anteriores = retrato congelado (PaperItem).
function linhasPaper(data, secId, par){
  if(data===S.hoje){
    return visiveis(secId, par).map(a=>{ const it=itemHoje(a.id); return { id:a.id, texto:a.texto, status:a.status, planejado:!!(it&&it.planejado) }; });
  }
  const p = paperDe(data); if(!p) return [];
  return p.itens.filter(i=>i.secaoId===secId && (i.parentId||null)===(par||null) && i.status!=='excluida').sort(byOrdem)
    .map(i=>({ id:i.atividadeId, texto:i.texto, status:i.status, planejado:false }));
}
function linhasSecao(s, data, ro){
  return linhasPaper(data, s.id, null).map(a=>linhaHtml({...a, nivel:1}, ro) +
    linhasPaper(data, s.id, a.id).map(c=>linhaHtml({...c, nivel:2}, ro)).join('')).join('');
}
// RF-16: navegação entre papers (« »). Pula os dias sem paper; não passa de hoje.
function datasNavegaveis(){ return S.papers.map(p=>p.data).filter(d=>d<=S.hoje).sort(); }
function dataVista(roDia){
  const base = roDia ? ultimoPaperAntes(S.hoje).data : S.hoje, v = T.viewDate;
  return (v && v!==base && paperDe(v) && v<=S.hoje) ? v : base;
}

function telaMain(roDia){

/* ---------- folha A4 ---------- */
function folhaHtml(fs){ // imprime o paper que está na tela (hoje ou um dia anterior)
  const p = paperDe(T.dataAtual) || paperHoje(), incl = T.imprimirConcluidos;
  const li = (a,n) => `<li class="lv${n} ${a.status==='concluida'?'done':''}"><span class="b">${n===1?'●':'○'}</span><span class="t">${esc(a.texto)}</span></li>`;
  const ok = a => incl || a.status!=='concluida';
  let h = `<div class="psheet" style="font-size:${fs}pt"><div class="date-band">${fmt(p.data)}</div>`;
  for(const s of secoesAtivas()){
    h += `<div class="sec-box"><div class="sec-head" style="background:${s.cor};color:${corTexto(s.cor)}">${esc(s.nome)}</div><ul class="plist">`;
    for(const a of linhasPaper(p.data,s.id,null)){ if(!ok(a)) continue; h += li(a,1); linhasPaper(p.data,s.id,a.id).filter(ok).forEach(c=>{ h += li(c,2); }); }
    h += `</ul><div class="notes"></div></div>`;
  }
  return h + `<div class="p-foot">${logoBranco(30)}</div></div>`;
}
// RF-54: reduz a fonte até caber em 1 página (mín. 9pt); acima disso, quebra sem cortar seção.
function ajustarImpressao(){
  const a4 = document.getElementById('a4'); if(!a4) return;
  const sheet = a4.querySelector('.psheet'), mm = 96/25.4, util = 277*mm;
  let fs = 12;
  for(; fs>=9; fs-=0.5){ sheet.style.fontSize = fs+'pt'; if(sheet.scrollHeight <= util) break; }
  const cabe = fs >= 9;
  if(!cabe){ fs = 9; sheet.style.fontSize = '9pt'; }
  T.printFs = fs;
  const paginas = cabe ? 1 : Math.ceil(sheet.scrollHeight/util);
  document.getElementById('fit-info').textContent = cabe ? `Fonte ${String(fs).replace('.',',')} pt · cabe em 1 página` : `Fonte mínima (9 pt) · ~${paginas} páginas, sem cortar seções`;
  const stage = document.getElementById('a4-stage'), wrap = document.getElementById('a4-scale');
  const esc_ = Math.min(1, (stage.clientWidth-24) / (210*mm), Math.max(0.35, (window.innerHeight*0.62) / a4.offsetHeight));
  a4.style.transform = `scale(${esc_})`;
  wrap.style.width = (a4.offsetWidth*esc_)+'px';
  wrap.style.height = (a4.offsetHeight*esc_)+'px';
}
function imprimir(){
  document.getElementById('print-root').innerHTML = folhaHtml(T.printFs);
  (paperDe(T.dataAtual) || paperHoje()).impressoEm = now(); salvar();
  window.print();
}

/* ---------- toasts ---------- */
function toast(msg, undo){
  const id = uid(); T.toasts.push({ id, msg, undo }); renderToasts();
  setTimeout(()=>{ T.toasts = T.toasts.filter(t=>t.id!==id); renderToasts(); }, undo ? 6000 : 3200);
}
function renderToasts(){
  document.getElementById('toasts').innerHTML = T.toasts.map(t=>`<div class="toast"><span>${t.msg}</span>${t.undo?`<button type="button" data-act="undo" data-id="${t.id}">Desfazer</button>`:''}</div>`).join('');
}

/* =====================================================================
   Eventos
   ===================================================================== */
function entrar(usuario){
  S.usuario = usuario; S.avisoNovoDia = false; T.loginMsg=''; T.loginMode='login'; T.wz=null;
  salvar(); render();
}
function sair(){ S.usuario=null; T.wz=null; T.viewDate=null; T.modal=null; T.dialog=null; T.editId=null; T.addMode={}; salvar(); render(); }
function confirmar(titulo, msg, ok, fn){ T.dialog = { tipo:'confirmar', titulo, msg, ok, fn }; render(); }

document.addEventListener('click', e=>{
  const ov = e.target.closest('[data-overlay]');
  if(ov && e.target===ov){ if(ov.dataset.overlay==='dialog') T.dialog=null; else T.modal=null; render(); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const id = el.dataset.id;
  switch(el.dataset.act){
    case 'login-google': entrar({ nome:'Sergio Resende', email:'(conta Google simulada)', provedor:'google' }); break;
    case 'login-mode': T.loginMode = el.dataset.mode; T.loginMsg=''; render(); break;
    case 'logout': // RF-05
      if(S.pendentesSync>0 && !S.online) confirmar('Sair do TodoList_C?', `Há <b>${S.pendentesSync}</b> alteração(ões) ainda não sincronizada(s). Se sair agora, elas continuam guardadas neste PC e serão enviadas no próximo login com conexão.`, 'Sair mesmo assim', sair);
      else sair();
      break;
    case 'modal': T.modal = el.dataset.m; render(); break;
    case 'close-modal': T.modal = null; render(); break;
    case 'close-dialog': T.dialog = null; render(); break;
    case 'print-open': T.modal = 'imprimir'; render(); break;
    case 'do-print': imprimir(); break;
    case 'sync-now':
      if(!S.online) toast('Sem conexão. As alterações ficam guardadas neste PC.');
      else { agendarSync(); renderSync(); }
      break;
    case 'toggle': concluir(id); break;
    case 'edit': T.editId = id; render(); break;
    case 'sub': { const a = ativ(id); T.addMode[a.secaoId] = id; T.focusKey = 'add:'+a.secaoId; render(); break; }
    case 'add-mode-off': delete T.addMode[id]; T.focusKey = 'add:'+id; render(); break;
    case 'plan': T.dialog = { tipo:'planejar', id }; render(); break;
    case 'move': T.dialog = { tipo:'mover', id }; render(); break;
    case 'up': mover(id,-1); break;
    case 'down': mover(id,1); break;
    case 'del': excluir(id); break;
    case 'trazer': {
      const a = ativ(id); incluirNoPaper(a); commit();
      toast(`“${esc(trunc(a.texto))}” está no paper de hoje`); break;
    }
    case 'fora-concluir': { const a = ativ(id); a.foraDoPaper=false; concluir(id); toast(`“${esc(trunc(a.texto))}” concluída`); break; }
    case 'sec-up': case 'sec-down': {
      const at = secoesAtivas(), i = at.findIndex(s=>s.id===id), j = i + (el.dataset.act==='sec-up'?-1:1);
      if(at[j]){ [at[i].ordem, at[j].ordem] = [at[j].ordem, at[i].ordem]; touch(at[i]); touch(at[j]); commit(); }
      break;
    }
    case 'sec-arq': {
      const s = secao(id), n = S.atividades.filter(a=>a.secaoId===id && a.status==='pendente').length;
      if(n) { T.dialog = { tipo:'arquivar', id }; render(); }
      else { s.arquivada = true; touch(s); commit(); toast(`Seção “${esc(s.nome)}” arquivada`); }
      break;
    }
    case 'sec-rest': { const s = secao(id); s.arquivada=false; s.ordem = Math.max(0,...secoesAtivas().map(x=>x.ordem))+1; touch(s); commit(); break; }
    case 'wz-excluir': {
      const grupo = [id, ...filhos(id).map(c=>c.id)];
      grupo.forEach(x=>T.wz.excluidos.add(x)); render();
      toast(`“${esc(trunc(ativ(id).texto))}” será excluída`, ()=>{ if(T.wz){ grupo.forEach(x=>T.wz.excluidos.delete(x)); render(); } });
      break;
    }
    case 'wz-rem-novo': T.wz.novos = T.wz.novos.filter(n=>n.id!==id); render(); break;
    case 'wz-criar': criarPaper(); break;
    case 'ver-dia': T.viewDate = el.dataset.dia===S.hoje ? null : el.dataset.dia; T.editId=null; render(); break;
    case 'abrir-wizard': S.avisoNovoDia = false; montarWizard(); salvar(); render(); break;
    case 'undo': { const t = T.toasts.find(x=>x.id===id); T.toasts = T.toasts.filter(x=>x.id!==id); renderToasts(); if(t && t.undo) t.undo(); break; }
    case 'sim-toggle': T.simOpen = !T.simOpen; render(); break;
    case 'sim-avancar': { // RF-15: mudança de data com o app aberto
      const n = +el.dataset.n;
      S.hoje = addDias(S.hoje, n); T.wz=null; T.viewDate=null; T.modal=null; T.dialog=null; T.editId=null; T.addMode={};
      S.avisoNovoDia = !!(S.usuario && ultimoPaperAntes(S.hoje));
      salvar(); render(); toast(`Data simulada: ${diaSemana(S.hoje)}, ${fmt(S.hoje)}`); break;
    }
    case 'sim-online':
      S.online = !S.online; salvar();
      if(S.online && S.pendentesSync>0) agendarSync();
      render(); toast(S.online ? 'Conexão restabelecida, sincronizando' : 'Sem conexão: o app continua funcionando normalmente');
      break;
    case 'sim-reset':
      confirmar('Reiniciar a demonstração?', el.dataset.modo==='vazio' ? 'Apaga tudo e começa como um primeiro uso, com as seções padrão “Profissional” e “Pessoal”.' : 'Apaga tudo e recarrega o paper de exemplo de 03/11/2026, com a data simulada em 04/11/2026.', 'Reiniciar', ()=>{
        S = novoEstado(el.dataset.modo); Object.assign(T, { wz:null, viewDate:null, modal:null, editId:null, addMode:{}, loginMode:'login', loginMsg:'' }); salvar(); render();
      });
      break;
  }
});

document.addEventListener('dblclick', e=>{
  const el = e.target.closest('[data-dbl]');
  if(el && el.dataset.dbl){ T.editId = el.dataset.dbl; render(); }
});

document.addEventListener('change', e=>{
  const t = e.target, d = t.dataset;
  if(d.wzCheck){ wzMarcar(d.wzCheck, t.checked); render(); return; }
  if(d.printConcl!==undefined){ T.imprimirConcluidos = t.checked; render(); return; }
  if(d.secCor){ const s=secao(d.secCor); s.cor=t.value; touch(s); commit(); return; }
  if(d.secNome){ const s=secao(d.secNome), v=t.value.trim(); if(v && v!==s.nome){ s.nome=v; touch(s); commit(); } else t.value=s.nome; return; }
  if(d.planDate){
    const a = ativ(d.planDate);
    if(t.value && t.value > S.hoje){ a.dataPlanejada = t.value; touch(a); commit(); }
    else { toast('Escolha uma data a partir de amanhã. Para hoje, use “Trazer para hoje”.'); render(); }
  }
});

document.addEventListener('focusout', e=>{
  const id = e.target.dataset && e.target.dataset.edit;
  if(id && T.editId===id){ T.editId=null; editarTexto(id, e.target.value); }
});

document.addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  switch(f.dataset.form){
    case 'login': entrar({ nome: d.email.split('@')[0], email:d.email, provedor:'email' }); break;
    case 'cadastro':
      if(d.senha !== d.senha2){ toast('As senhas não conferem.'); return; }
      T.loginMode='login'; T.loginMsg = `Enviamos um e-mail de confirmação para <b>${esc(d.email)}</b> (simulado). Conta criada.`;
      entrar({ nome:d.nome, email:d.email, provedor:'email' }); break;
    case 'recuperar': T.loginMsg = `Se existir uma conta para <b>${esc(d.email)}</b>, enviamos um link para redefinir a senha (simulado).`; render(); break;
    case 'nova-planejada':
      if(!(d.data > S.hoje)){ toast('A data precisa ser a partir de amanhã.'); return; }
      novaAtividade(d.secao, null, d.texto.trim(), d.data); commit(); toast(`Planejada para ${fmt(d.data)}`); break;
    case 'nova-secao': {
      const nome = d.nome.trim(); if(!nome) return;
      S.secoes.push({ id:uid(), nome, cor:COR_SECAO, ordem:Math.max(0,...S.secoes.map(s=>s.ordem))+1, arquivada:false, updatedAt:now() });
      commit(); break;
    }
    case 'dlg-planejar': {
      if(!(d.data > S.hoje)){ toast('A data precisa ser a partir de amanhã.'); return; }
      const id = T.dialog.id; T.dialog=null; planejar(id, d.data); break;
    }
    case 'dlg-mover': { const id = T.dialog.id; T.dialog=null; moverSecao(id, d.secao); break; }
    case 'dlg-arquivar': {
      const s = secao(T.dialog.id); T.dialog=null;
      S.atividades.filter(a=>a.secaoId===s.id && a.status!=='excluida').forEach(a=>{ a.secaoId=d.destino; if(a.status==='pendente') a.ordem=++S.seq; touch(a); });
      s.arquivada = true; touch(s); commit(); toast(`Atividades movidas e seção “${esc(s.nome)}” arquivada`); break;
    }
    case 'dlg-confirmar': { const fn = T.dialog.fn; T.dialog=null; fn(); break; }
  }
});

document.addEventListener('keydown', e=>{
  const t = e.target, d = t.dataset || {};

  if(e.key==='Escape'){
    if(T.editId){ T.editId=null; T.focusRow=d.edit; render(); return; }
    if(T.dialog){ T.dialog=null; render(); return; }
    if(T.modal){ T.modal=null; render(); return; }
    if(d.add && T.addMode[d.add]){ delete T.addMode[d.add]; T.focusKey='add:'+d.add; render(); return; }
  }
  // navegar entre papers (RF-16)
  if(e.altKey && (e.key==='ArrowLeft' || e.key==='ArrowRight') && !/INPUT|TEXTAREA|SELECT/.test(t.tagName)
     && S.usuario && !T.wz && !T.modal && !T.dialog){
    const b = [...document.querySelectorAll('.date-band.nav .nav-btn')][e.key==='ArrowLeft'?0:1];
    e.preventDefault(); if(b && !b.disabled) b.click(); return;
  }
  // edição inline
  if(d.edit){
    const id = d.edit;
    if(e.key==='Enter'){ e.preventDefault(); T.editId=null; T.focusRow=id; editarTexto(id, t.value); }
    else if(e.key==='Tab'){
      e.preventDefault(); T.editId=null; T.focusRow=id; editarTexto(id, t.value);
      e.shiftKey ? desrecuar(id) : recuar(id);
    }
    return;
  }
  // campo "Adicionar atividade" (RF-20 / RF-21)
  if(d.add){
    const sid = d.add;
    if(e.key==='Enter'){
      e.preventDefault(); const v = t.value.trim(); if(!v) return;
      criarNoPaper(sid, T.addMode[sid]||null, v); T.focusKey='add:'+sid; commit();
    } else if(e.key==='Tab' && !e.shiftKey && !T.addMode[sid]){
      const tops = visiveis(sid,null);
      if(tops.length){ e.preventDefault(); T.addMode[sid] = tops[tops.length-1].id; T.focusKey='add:'+sid; T.focusVal=t.value; render(); }
    } else if(e.key==='Tab' && e.shiftKey && T.addMode[sid]){
      e.preventDefault(); delete T.addMode[sid]; T.focusKey='add:'+sid; T.focusVal=t.value; render();
    }
    return;
  }
  if(d.wzAdd){
    if(e.key==='Enter'){
      e.preventDefault(); const v=t.value.trim(); if(!v) return;
      T.wz.novos.push({ id:uid(), secaoId:d.wzAdd, texto:v }); T.focusKey='wzadd:'+d.wzAdd; render();
    }
    return;
  }
  if(d.secNome && e.key==='Enter'){ t.blur(); return; }
  // atividade selecionada
  if(d.row && t===e.target && t.classList.contains('row')){
    const id = d.row;
    if(e.key===' '){ e.preventDefault(); concluir(id); }
    else if(e.key==='F2' || e.key==='Enter'){ e.preventDefault(); T.editId=id; render(); }
    else if(e.key==='Delete'){ e.preventDefault(); excluir(id); }
    else if(e.altKey && e.key==='ArrowUp'){ e.preventDefault(); mover(id,-1); }
    else if(e.altKey && e.key==='ArrowDown'){ e.preventDefault(); mover(id,1); }
    else if(e.key==='ArrowUp' || e.key==='ArrowDown'){
      e.preventDefault();
      const rows = [...document.querySelectorAll('[data-row]')], i = rows.indexOf(t), n = rows[i + (e.key==='ArrowUp'?-1:1)];
      if(n) n.focus();
    }
    else if(e.key==='Tab' && !e.shiftKey && podeRecuar(id)){ e.preventDefault(); recuar(id); }
    else if(e.key==='Tab' && e.shiftKey && ativ(id).parentId){ e.preventDefault(); desrecuar(id); }
    return;
  }
  // atalhos globais
  const naTelaPrincipal = S.usuario && paperHoje() && !T.wz && !T.modal && !T.dialog;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='p' && naTelaPrincipal){ e.preventDefault(); T.modal='imprimir'; render(); return; }
  if(/INPUT|TEXTAREA|SELECT/.test(t.tagName) || e.ctrlKey || e.altKey || e.metaKey || !naTelaPrincipal) return;
  if(e.key==='n' || e.key==='N'){ const el=document.querySelector('[data-add]'); if(el){ e.preventDefault(); el.focus(); } }
  else if(e.key==='?'){ T.modal='atalhos'; render(); }
});

window.addEventListener('resize', ()=>{ if(T.modal==='imprimir') ajustarImpressao(); });

/* ---------- início ---------- */
S = carregar() || novoEstado('exemplo');
render();
</script>
</body>
</html>
